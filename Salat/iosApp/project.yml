# XcodeGen-oppsett. Xcode-prosjektet genereres fra denne filen i GitHub Actions.
name: Salat
options:
  bundleIdPrefix: no.jodal
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  # Henter lyden fra YouTube-videoer i Ekko.
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    from: 0.4.9
targets:
  Salat:
    type: application
    platform: iOS
    # Common deles med widgetene.
    sources: [Salat, Common]
    dependencies:
      - package: YouTubeKit
      - target: SalatWidgets
    scheme: {}
    entitlements:
      path: Salat/Salat.entitlements
      properties:
        # Mappen appen deler med widgetene. SideStore gir den et nytt navn når appen signeres.
        com.apple.security.application-groups: [group.no.jodal.salat]
    info:
      path: Salat/Info.plist
      properties:
        CFBundleDisplayName: Salat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CADisableMinimumFrameDurationOnPhone: true
        NSAlarmKitUsageDescription: Rise bruker alarmer for å vekke deg og minne deg på ting, også når telefonen står på lydløs.
        NSMicrophoneUsageDescription: Kompis bruker mikrofonen så du kan snakke med den.
        # Lar samtaler med Kompis og lyder i Ekko fortsette når skjermen er låst.
        UIBackgroundModes: [audio]
        # Lenker fra widgetene, f.eks. salat://kompis/start.
        CFBundleURLTypes:
          - CFBundleURLName: no.jodal.salat
            CFBundleURLSchemes: [salat]
        # SideStore skriver det nye navnet på app-gruppen hit.
        ALTAppGroups: [group.no.jodal.salat]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.jodal.salat
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Kotlin-koden bygges som et statisk rammeverk av Gradle-steget under.
        KOTLIN_FRAMEWORK_BUILD_TYPE: $(CONFIGURATION)
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(KOTLIN_FRAMEWORK_BUILD_TYPE)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework Shared
        # Gradle-steget må kunne lese og skrive utenfor Xcode sin sandkasse.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Bygg Kotlin
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          # Kotlin-pluginen prioriterer CONFIGURATION over KOTLIN_FRAMEWORK_BUILD_TYPE.
          # Overstyr bare for Gradle; Swift og resten av Xcode-bygget forblir i Release.
          CONFIGURATION="${KOTLIN_FRAMEWORK_BUILD_TYPE:-$CONFIGURATION}" ./gradlew :shared:embedAndSignAppleFrameworkForXcode
  SalatWidgets:
    type: app-extension
    platform: iOS
    sources: [SalatWidgets, Common]
    info:
      path: SalatWidgets/Info.plist
      properties:
        CFBundleDisplayName: Salat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        ALTAppGroups: [group.no.jodal.salat]
    entitlements:
      path: SalatWidgets/SalatWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.no.jodal.salat]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.jodal.salat.widgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        # Koden i Common vet da at den er i widgetene, ikke i appen.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
