name: Salat

on:
  push:
    branches: [main]
    paths:
      - "Salat/**"
      - "!Salat/**/*.md"
      - ".github/workflows/salat.yml"
      - ".github/scripts/update_sidestore_source.py"
  pull_request:
    paths:
      - "Salat/**"
      - "!Salat/**/*.md"
      - ".github/workflows/salat.yml"
      - ".github/scripts/update_sidestore_source.py"
  workflow_dispatch:
    inputs:
      release:
        description: "Bygg Kotlin-delen i Release (tregere, men raskere i appen)"
        type: boolean
        default: false

# Nye pushes til en PR avbryter bygget som allerede går. Bygg på main får alltid gå ferdig.
concurrency:
  group: salat-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: Salat
    env:
      # Hvert bygg får et nytt versjonsnummer, så SideStore ser at det finnes en oppdatering.
      VERSION: 0.1.${{ github.run_number }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Debug-bygget av Kotlin bruker ferdiglagde biblioteker i ~/.konan, og samme mappe tar vare på det
      # Kotlin/Native lager selv. Nøkkelen har «debug» i seg, så første bygg etter bytte lagrer en ny cache.
      - name: Cache Kotlin/Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-debug-${{ runner.os }}-${{ hashFiles('Salat/gradle/libs.versions.toml') }}

      - name: Generate Xcode project
        working-directory: Salat/iosApp
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ENV_HINTS: 1
        run: |
          brew install xcodegen
          xcodegen generate

      # Kotlin bygges i Debug: Release optimaliserer hele Compose fra bunnen av i hvert bygg, og det tok
      # åtte minutter eller mer. Resten av appen (Swift) bygges fortsatt i Release. Kjør workflowen for
      # hånd med «release» på for en ferdig optimalisert Kotlin-del.
      - name: Build app (unsigned)
        working-directory: Salat/iosApp
        env:
          KOTLIN_FRAMEWORK_BUILD_TYPE: ${{ inputs.release && 'release' || 'debug' }}
        run: |
          xcodebuild build \
            -project Salat.xcodeproj \
            -scheme Salat \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # SideStore signerer appen selv. Den leser likevel hvilke rettigheter appen trenger (som
      # app-gruppen widgetene deler med appen) fra signaturen, så appen signeres uten sertifikat først.
      - name: Package .ipa
        working-directory: Salat/iosApp/build
        run: |
          mkdir Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/Salat.app Payload/
          codesign --force --sign - --entitlements ../SalatWidgets/SalatWidgets.entitlements Payload/Salat.app/PlugIns/SalatWidgets.appex
          codesign --force --sign - --entitlements ../Salat/Salat.entitlements Payload/Salat.app
          codesign --display --entitlements - Payload/Salat.app
          zip -qry Salat.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: Salat
          path: Salat/iosApp/build/Salat.ipa

      # Hvert bygg fra main blir en egen release, så .ipa-en kan lastes ned rett på telefonen.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: Salat/iosApp/build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "salat-v$VERSION" Salat.ipa \
            --target "$GITHUB_SHA" \
            --title "Salat $VERSION" \
            --notes "Bygget fra $GITHUB_SHA."

      # SideStore-kilden ligger i releasen «sidestore». SideStore sjekker den for nye versjoner.
      - name: Update SideStore source
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: Salat/iosApp/build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view sidestore > /dev/null 2>&1; then
            gh release create sidestore \
              --latest=false \
              --title "SideStore-kilde" \
              --notes "Legg til https://github.com/$GITHUB_REPOSITORY/releases/download/sidestore/source.json som kilde i SideStore for å få oppdateringer."
          fi
          gh release download sidestore --pattern source.json || true
          python3 -I "$GITHUB_WORKSPACE/.github/scripts/update_sidestore_source.py" \
            --source source.json \
            --repo "$GITHUB_REPOSITORY" \
            --app Payload/Salat.app \
            --ipa Salat.ipa \
            --download-url "https://github.com/$GITHUB_REPOSITORY/releases/download/salat-v$VERSION/Salat.ipa" \
            --icon-url "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/Salat/iosApp/Salat/Assets.xcassets/AppIcon.appiconset/AppIcon.png" \
            --description "En «alt mulig»-app med mange små apper inni." \
            --tint-color 8CD47E \
            --notes "$(git log -1 --format=%s "$GITHUB_SHA")"
          gh release upload sidestore source.json --clobber
