name: Kompis and shared tests

on:
  push:
    branches: [main]
    paths:
      - 'Salat/**'
      - '!Salat/**/*.md'
      - '.github/workflows/kompis-tests.yml'
  pull_request:
    paths:
      - 'Salat/**'
      - '!Salat/**/*.md'
      - '.github/workflows/kompis-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Salat
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run shared tests
        run: ./gradlew :shared:desktopTest
